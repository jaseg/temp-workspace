<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.5 -4 10 7" width="100mm" height="70mm">
  <!-- Fixed parts of the cat bus (see characters.cat_bus):
       #bus-head: the head, upright, with headlight eyes and a big grin. Placed with <use href="#bus-head"
         transform="translate(...)" stroke="#7a6888" stroke-width=".22" stroke-linejoin="round"/>.
       #bus-window: a window on its back, centred on the bus line. Placed with <use href="#bus-window"
         transform="translate(...) rotate(...)"/>. -->
  <defs>
    <g id="bus-head">
      <path d="M-2.45 -.9L-2.1 -3.4L-.8 -2.2Z" fill="#ffd6a8"/>
      <path d="M2.45 -.9L2.1 -3.4L.8 -2.2Z" fill="#ffd6a8"/>
      <path d="M-2.05 -1.3L-1.95 -2.75L-1.15 -2.05Z" fill="#ffb3cf" stroke="none"/>
      <path d="M2.05 -1.3L1.95 -2.75L1.15 -2.05Z" fill="#ffb3cf" stroke="none"/>
      <ellipse rx="2.75" ry="2.3" fill="#ffd6a8"/>
      <path d="M-.6 -2.2Q0 -1.6 .6 -2.2M-.3 -2.25V-1.75M.3 -2.25V-1.75" fill="none" stroke="#efae78" stroke-width=".28"/>
      <circle cx="-1.15" cy="-.55" r="1.35" fill="#fff6a0" stroke="none" opacity=".45"/>
      <circle cx="1.15" cy="-.55" r="1.35" fill="#fff6a0" stroke="none" opacity=".45"/>
      <circle cx="-1.15" cy="-.55" r=".82" fill="#fff8c2"/>
      <circle cx="1.15" cy="-.55" r=".82" fill="#fff8c2"/>
      <circle cx="-1.05" cy="-.5" r=".34" fill="#4b3a5a" stroke="none"/>
      <circle cx="1.25" cy="-.5" r=".34" fill="#4b3a5a" stroke="none"/>
      <circle cx="-.95" cy="-.62" r=".11" fill="#fff" stroke="none"/>
      <circle cx="1.35" cy="-.62" r=".11" fill="#fff" stroke="none"/>
      <path d="M-1.75 .55Q0 2.5 1.75 .55Q0 1.25 -1.75 .55Z" fill="#fff" stroke-width=".18"/>
      <path d="M-.9 .95l.05 .55M-.3 1.08v.7M.3 1.08v.7M.9 .95l-.05 .55" fill="none" stroke-width=".1"/>
      <ellipse cx="-2.05" cy=".55" rx=".42" ry=".22" fill="#ff9cc2" stroke="none" opacity=".8"/>
      <ellipse cx="2.05" cy=".55" rx=".42" ry=".22" fill="#ff9cc2" stroke="none" opacity=".8"/>
      <path d="M-1.6 .2l-1.6 -.25M-1.6 .5l-1.6 .15M1.6 .2l1.6 -.25M1.6 .5l1.6 .15" fill="none" stroke-width=".09"/>
    </g>
    <g id="bus-window">
      <rect x="-.85" y="-.75" width="1.7" height="1.3" rx=".35" fill="#d9f1ff" fill-opacity=".72" stroke="#7a6888" stroke-width=".16"/>
      <path d="M-.5 -.45l.45 .55" stroke="#fff" stroke-width=".22" stroke-linecap="round"/>
    </g>
  </defs>
  <use href="#bus-head" stroke="#7a6888" stroke-width=".22" stroke-linejoin="round"/>
  <use href="#bus-window" transform="translate(5 0)"/>
</svg>
