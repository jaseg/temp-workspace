<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 20" width="172mm" height="40mm">
  <!-- Screentones and gradients for the page, used as fill="url(#...)".
       tone-w: fine white dots (highlights); tone-ink: dense ink dots (drop shadows); tone-pink: big pink dots
       (the mascot); tone-bg: the page background, shown through the #vignette mask (styles/defs.svg.j2), which
       fades it in towards the edges with vig-g. title-grad and banner-grad colour the title panel and the text
       banners. browser.py turns the tones into vector dots for PDFs and keeps its own copy of their pitch, dot
       size, angle and colour (TONES), so change both together. -->
  <defs>
    <pattern id="tone-w" width="1.1" height="1.1" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx=".55" cy=".55" r=".2" fill="#fff" opacity=".7"/></pattern>
    <pattern id="tone-ink" width=".9" height=".9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx=".45" cy=".45" r=".3" fill="#4b3a5a"/></pattern>
    <pattern id="tone-pink" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="1.5" cy="1.5" r=".7" fill="#ffc2da"/></pattern>
    <pattern id="tone-bg" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="1.6" cy="1.6" r=".42" fill="#ffd3e4"/></pattern>
    <radialGradient id="vig-g" cx=".5" cy=".5" r=".72"><stop offset=".75" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
    <linearGradient id="title-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset=".5" stop-color="#e7dcff"/><stop offset="1" stop-color="#cdf3ea"/></linearGradient>
    <linearGradient id="banner-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffc1dc"/><stop offset=".5" stop-color="#d9c8ff"/><stop offset="1" stop-color="#bdeee2"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="10" height="16" fill="#ffd6e8"/>
  <rect x="2" y="2" width="10" height="16" fill="url(#tone-w)"/>
  <rect x="14" y="2" width="10" height="16" fill="url(#tone-ink)"/>
  <rect x="26" y="2" width="10" height="16" fill="url(#tone-pink)"/>
  <rect x="38" y="2" width="10" height="16" fill="url(#tone-bg)"/>
  <rect x="50" y="2" width="10" height="16" fill="url(#vig-g)"/>
  <rect x="62" y="2" width="10" height="16" fill="url(#title-grad)"/>
  <rect x="74" y="2" width="10" height="16" fill="url(#banner-grad)"/>
</svg>
