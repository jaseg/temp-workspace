[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "yanartas-mesh"
description = "The mesh layout's settling for yanartas-pillowbox, in Rust (optional: the package falls back to numpy)."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["numpy"]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "yanartas_mesh"

[tool.uv]
# (rebuilt by uv sync whenever the Rust sources change)
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../core/Cargo.toml" },
    { file = "../core/src/**/*.rs" },
]
