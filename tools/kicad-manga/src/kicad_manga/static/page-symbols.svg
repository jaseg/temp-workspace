<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -7 68 14" width="136mm" height="28mm">
  <!-- Small symbols drawn around (0, 0), coloured by the fill of the <use> that places them: heart and blossom
       (about 2 units, for charms and the like), and the 10-unit sparkle, heart-d, star and blossom-d that are
       sprinkled over the page as confetti. -->
  <defs>
    <path id="heart" d="M0 .55C-.95-.1-1-.75-.62-.95-.32-1.1-.08-.9 0-.65.08-.9.32-1.1.62-.95 1-.75.95-.1 0 .55Z" fill="#ff7fb2" stroke="#4b3a5a" stroke-width=".16" stroke-linejoin="round"/>
    <g id="blossom"><circle r=".75" stroke="#4b3a5a" stroke-width=".18"/><circle r=".28" fill="#fff6a8"/></g>
    <path id="sparkle" d="M0-5C.6-1.2 1.2-.6 5 0 1.2.6.6 1.2 0 5-.6 1.2-1.2.6-5 0-1.2-.6-.6-1.2 0-5Z" stroke="#4b3a5a" stroke-width=".35" stroke-linejoin="round"/>
    <path id="heart-d" d="M0 4C-6.5-.5-6.8-4.6-4.2-5.8-2.2-6.7-.6-5.3 0-3.8.6-5.3 2.2-6.7 4.2-5.8 6.8-4.6 6.5-.5 0 4Z" transform="translate(0 1)" stroke="#4b3a5a" stroke-width=".4" stroke-linejoin="round"/>
    <path id="star" d="M0-5 1.4-1.6 5-1.5 2.2.8 3.1 4.4 0 2.4-3.1 4.4-2.2.8-5-1.5-1.4-1.6Z" stroke="#4b3a5a" stroke-width=".4" stroke-linejoin="round"/>
    <g id="blossom-d" stroke="#4b3a5a" stroke-width=".35">
      <g id="petals">
        <ellipse cx="0" cy="-2.6" rx="1.9" ry="2.6" transform="rotate(0)"/>
        <ellipse cx="0" cy="-2.6" rx="1.9" ry="2.6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-2.6" rx="1.9" ry="2.6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-2.6" rx="1.9" ry="2.6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-2.6" rx="1.9" ry="2.6" transform="rotate(288)"/>
      </g>
      <circle r="1.3" fill="#fff3a0"/>
    </g>
  </defs>
  <use href="#heart" transform="scale(2)"/>
  <use href="#blossom" transform="translate(8 0) scale(2)" fill="#ffb8d0"/>
  <use href="#sparkle" transform="translate(20 0)" fill="#ffe58f"/>
  <use href="#heart-d" transform="translate(32 0)" fill="#ff9cc2"/>
  <use href="#star" transform="translate(44 0)" fill="#b3d4ff"/>
  <use href="#blossom-d" transform="translate(56 0)" fill="#ffb8d0"/>
</svg>
