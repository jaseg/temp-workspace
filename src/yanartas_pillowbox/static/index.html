<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pillow Box Designer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 4q6-3 12 0v8q-6 3-12 0z' fill='%23e8b04b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>yanartas-pillowbox</h1>
      <span class="status" id="status" aria-live="polite"></span>
      <progress id="mesh-progress" max="1" value="0" hidden aria-label="Mesh layout progress"></progress>
    </div>
    <div class="actions">
      <button type="button" id="btn-import">Import SVG…</button>
      <input type="file" id="file-input" accept=".svg,image/svg+xml" hidden>
      <button type="button" id="btn-reset">Reset to defaults</button>
      <button type="button" id="btn-pcb" disabled title="The flex PCB layout with its security mesh: KiCad board and project, Gerber and drill files, SVGs (zip)">Download PCB</button>
      <button type="button" id="btn-scad" disabled title="OpenSCAD model of the interior: the payload space and the spaces between the end walls">Download OpenSCAD</button>
      <button type="button" id="btn-download" class="primary" disabled>Download SVG</button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-close" aria-label="Dismiss">×</button>
  </div>

  <main class="layout">
    <aside class="sidebar">
      <form id="params" class="params" novalidate autocomplete="off"></form>
      <section class="derived" aria-label="Derived geometry">
        <h2>Derived geometry</h2>
        <dl id="derived"></dl>
        <div id="mesh-stats" hidden>
          <h3>PCB mesh</h3>
          <dl id="mesh-derived"></dl>
        </div>
      </section>
    </aside>
    <div class="splitter" data-split="sidebar" aria-label="Resize the parameters panel"></div>
    <section class="previews">
      <pb-preview2d id="preview2d"></pb-preview2d>
      <div class="splitter" data-split="previews" aria-label="Resize the pattern preview"></div>
      <div class="lower-row">
        <pb-preview3d id="preview3d"></pb-preview3d>
        <div class="splitter" data-split="lower" aria-label="Resize the folded box preview"></div>
        <pb-section id="section"></pb-section>
      </div>
    </section>
  </main>

  <div id="dropzone" class="dropzone" hidden>
    <div>Drop an SVG generated by yanartas-pillowbox to restore its settings</div>
  </div>
</body>
</html>
