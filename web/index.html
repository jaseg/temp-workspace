<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiCad Diff</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { padding: 8px; box-sizing: border-box; background: Canvas; color: CanvasText; }
    kicad-diff, kicad-diff-project { height: 100%; }
  </style>
  <script type="module" src="../src/ui/kicad-diff.js"></script>
  <script type="module" src="../src/ui/project.js"></script>
</head>
<body>
  <script type="module">
    // ?old=URL&new=URL[&config=URL][&mode=diff][&ui=dark][&theme=NAME][&hide=LAYER,...][&project=1]
    // A .kicad_pro URL (or project=1 with a top-level .kicad_sch) opens the project overview.
    import { configFromParams, mergeConfig } from '../src/config.js';
    const q = new URLSearchParams(location.search);
    const project = q.get('project') === '1' || [q.get('old'), q.get('new')].some(u => u?.split(/[?#]/)[0].endsWith('.kicad_pro'));
    const el = document.createElement(project ? 'kicad-diff-project' : 'kicad-diff');
    let fileConfig = {};
    if (q.has('config')) fileConfig = await fetch(q.get('config')).then(r => (r.ok ? r.json() : {}), () => ({}));
    el.config = mergeConfig(fileConfig, configFromParams(q));
    for (const [param, attr] of [['old', 'old-src'], ['new', 'new-src']]) {
      if (q.has(param)) el.setAttribute(attr, q.get(param));
    }
    document.body.append(el);
  </script>
</body>
</html>
