[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kicad-manga"
version = "0.1.0"
description = "Render a KiCad schematic as a pastel, manga-styled poster, or as a Minecraft redstone build (SVG, PNG, PDF)."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [{ name = "jaseg" }]
dependencies = [
    "click>=8.5.1",
    "fonttools[woff]>=4.68.0",
    "gerbonara",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.4",
    "pikepdf>=9.0",
    "pillow>=11.0",
    "requests>=2.34.2",
    "resvg-py>=0.5.0",
    "uharfbuzz>=0.57.0",
]

[project.scripts]
kicad-manga = "kicad_manga.cli:main"

[tool.uv.sources]
gerbonara = { path = "../gerbonara" }   # local fork with KiCad 9/10 schematic support, see ../gerbonara/FORK.md

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
