[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "yanartas-pillowbox"
version = "0.1.0"
description = "Generate laser-ready SVG folding patterns for pillow boxes, configured through a local web UI."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "jaseg" }]
dependencies = [
    "flask>=3.0",
    "gerbonara>=1.6.3",
    "shapely>=2.2.0",
    "yanartas-mesh",  # (the mesh settling's Rust core: rust/python, built with maturin)
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Web Environment",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
yanartas-pillowbox = "yanartas_pillowbox.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[tool.uv.sources]
yanartas-mesh = { path = "rust/python" }

[tool.hatch.build.targets.wheel]
packages = ["src/yanartas_pillowbox"]

[tool.hatch.build.targets.sdist]
include = ["src/yanartas_pillowbox", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses 12 -m 'not slow'"  # pytest-xdist: CPU-bound, independent tests
markers = ["slow: full-size layouts that take minutes (run with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/yanartas_pillowbox/static", "docs/partition/partition.ipynb"]  # (the notebook: teaching code)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
